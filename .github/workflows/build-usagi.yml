name: Build Usagi Desktop Testversion

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - feat/usagi-gitlab

jobs:
  build-windows:
    name: Build Windows x64 Testversion
    runs-on: windows-2022
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build:prod
        env:
          NODE_ENV: production

      - name: Package Windows app
        run: npm run package
        continue-on-error: true

      - name: Archive build output
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Compress-Archive -Path dist/* -DestinationPath Usagi-Desktop-Windows-x64.zip -Force
          }

      - name: Upload Testversion Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Usagi-Desktop-Windows-x64
          path: |
            Usagi-Desktop-Windows-x64.zip
            dist/*.exe
            dist/*.nupkg
